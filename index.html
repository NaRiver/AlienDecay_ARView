
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MindAR Troubleshooting</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-family: sans-serif;
      font-size: 16px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="status">Loading AR...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-assets>
      <!-- We'll add the GLB model after tracking works -->
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-plane
        position="0 0 0"
        width="1"
        height="0.552"
        material="color: blue; opacity: 0.5; transparent: true; side: double"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const status = document.querySelector("#status");
    const sceneEl = document.querySelector("a-scene");
    const targetEl = document.querySelector("#target");

    sceneEl.addEventListener("loaded", () => {
      status.textContent = "Scene loaded. Starting camera...";
    });

    sceneEl.addEventListener("arReady", () => {
      status.textContent = "Camera started. Point it at the target image.";
    });

    sceneEl.addEventListener("arError", (event) => {
      status.textContent = "AR error: " + JSON.stringify(event.detail);
    });

    targetEl.addEventListener("targetFound", () => {
      status.textContent = "TARGET FOUND!";
    });

    targetEl.addEventListener("targetLost", () => {
      status.textContent = "Target lost. Point camera at the image.";
    });
  </script>
</body>
</html>
