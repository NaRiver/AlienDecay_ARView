
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KuanMau - AR Exhibit</title>

  <!-- Google Model Viewer -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eeeeee;
      color: #222;
      text-align: center;
    }

    h1 {
      padding: 15px;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background-color: #eeeeee;
    }

    p {
      padding: 10px;
    }
  </style>
</head>

<body>

  <h1>KuanMau</h1>

  <p>Rotate the model or select the AR button to view it in your surroundings.</p>

  <model-viewer
    src="./KuanMau.glb"
    alt="3D model of KuanMau"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">

    <button slot="ar-button">
      View in your space
    </button>

  </model-viewer>

</body>
</html>
